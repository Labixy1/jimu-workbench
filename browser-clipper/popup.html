<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>积木网页采集</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="mark">积</span><div><h1>采集到积木</h1><p>把正在阅读的内容留下来</p></div></header>
<button id="capture" class="primary">读取当前文章</button>
<form id="handoff" hidden><label>标题<input id="title" maxlength="200" required></label><label>来源<input id="url" readonly></label><label>正文<textarea id="content" rows="8" required maxlength="40000"></textarea></label><div id="metadata"></div><button class="primary">带到积木预览</button></form>
<details><summary>积木地址</summary><input id="endpoint" type="url" value="http://127.0.0.1:8768" aria-label="积木地址"><small>可改为当前使用的本机端口。</small></details>
<p id="status" role="status"></p><footer>只读取当前文章或选中文字，不读取密码与 Cookie。保存前可以选择目录与收藏分类。</footer>
<script src="extract.js"></script><script src="popup.js"></script></body></html>
